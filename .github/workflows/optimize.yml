name: ⚡ Optimize PNG files

on:
  push:
    branches:
      - '[0-9].[0-9]+**'
      - snapshot
    paths:
      - '**/*.png'

concurrency:
  group: optimize-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: ⚡ Optimize PNG files
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 📦 Install oxipng
        uses: baptiste0928/cargo-install@v3
        with:
          crate: oxipng
          version: latest

      - name: 🧾 Get changed PNG files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: "**/*.png"

      - name: ⚡ Optimize PNG files
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Changed PNGs: ${{ steps.changed-files.outputs.all_changed_files }}"
          echo "${{ steps.changed-files.outputs.all_changed_files }}" | tr ' ' '\n' | grep -v '^$' | tr '\n' '\0' | xargs -0 -r oxipng -o 3 -i off --strip safe
          echo "Done."

      - name: 🧾 Get optimized PNG files
        id: optimized-files
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "all_optimized_files<<$EOF" >> $GITHUB_OUTPUT
          echo "$(git status --porcelain | sed s/^...//)" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: ⬆️ Commit and push changes
        if: ${{ steps.optimized-files.outputs.all_optimized_files }}
        uses: planetscale/ghcommit-action@v0.2.22
        with:
          commit_message: ':zap: Optimize PNG files'
          repo: ${{ github.repository }}
          branch: ${{ github.head_ref || github.ref_name }}
          file_pattern: "."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
